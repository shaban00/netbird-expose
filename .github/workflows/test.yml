name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint

  integration:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gate on secret
        id: gate
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          if [ -n "$NETBIRD_SETUP_KEY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No NETBIRD_SETUP_KEY set; skipping the live expose test."
          fi

      - name: Create a throwaway service to expose
        if: steps.gate.outputs.run == 'true'
        run: |
          cat > Dockerfile <<'DOCKER'
          FROM nginx:alpine
          DOCKER

      - name: NetBird Connect
        if: steps.gate.outputs.run == 'true'
        uses: shaban00/netbird-connect@v1.1.0
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          management-url: ${{ secrets.NETBIRD_MANAGEMENT_URL }}
          repo: ${{ vars.NETBIRD_CLIENT_REPO || 'netbirdio/netbird' }}
          hostname: gh-runner-${{ github.run_id }}

      - name: NetBird Expose
        id: expose
        if: steps.gate.outputs.run == 'true'
        uses: ./
        with:
          port: '8080'
          container-port: '80'   # nginx listens on 80
          protocol: http
          expose-duration: '2m'
          background: true

      - name: Fetch the exposed service
        if: steps.gate.outputs.run == 'true'
        env:
          URL: ${{ steps.expose.outputs.url }}
        run: curl -fsS "$URL" | grep -q 'Welcome to nginx'
